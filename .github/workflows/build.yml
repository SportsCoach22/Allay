name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libegl1-mesa libxi6 libxrandr2 libxcursor1 libxinerama1

    - name: Install Flet and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet yt-dlp

    - name: Build APK with Flet
      run: |
        flet build apk
